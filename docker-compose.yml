services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # No host port: reachable only by the frontend container
    # on the compose network.
    volumes:
      - ./data:/app/data
    environment:
      # Optional: only used as fallback when the user doesn't
      # paste their own key in the UI header bar. User-supplied
      # keys are per-request, never stored.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/health',
          timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes: {}
