server {
    listen 80;
    server_name _;

    # upload size cap — keep in sync with MAX_UPLOAD_MB in src/api.ts;
    # the client validates first and shows a friendly message, this is the
    # backstop. 413 is returned as JSON so the app can display it.
    client_max_body_size 10m;
    error_page 413 = @too_large;

    location @too_large {
        default_type application/json;
        return 413 '{"detail": "Image is too large — the max file size is 10 MB."}';
    }

    root /usr/share/nginx/html;
    index index.html;

    # hashed build assets: cache forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + images -> FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;  # image generation can take a while
    }

    location /images/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}