name: Build desktop apps

# All builds are unsigned: manual runs upload QA artifacts, version tags publish
# installers to GitHub Releases without requiring signing credentials.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Rendervous-windows-x64
          - os: macos-15
            artifact: Rendervous-macos-arm64
          - os: macos-15-intel
            artifact: Rendervous-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must be vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          else
            APP_VERSION="0.1.0"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build frontend
        run: npm ci && npm run build

      - name: Install backend + packaging deps
        run: pip install -r requirements-desktop.txt

      - name: Build app
        run: >-
          pyinstaller packaging/rendervous.spec --noconfirm
          --distpath build/app --workpath build/pyinstaller

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          $iscc = Join-Path "${env:ProgramFiles(x86)}" `
            'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler was not found.'
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" `
            packaging/windows/Rendervous.iss
          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup compilation failed.'
          }

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p build/release build/dmg
          cp -R build/app/Rendervous.app build/dmg/
          ln -s /Applications build/dmg/Applications
          DMG="build/release/${{ matrix.artifact }}-$APP_VERSION.dmg"
          hdiutil create -volname Rendervous -srcfolder build/dmg \
            -ov -format UDZO "$DMG"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: Rendervous-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-assets/*
          --title "${GITHUB_REF_NAME}"
          --notes "Unsigned: Windows may show SmartScreen. macOS: open the
          DMG, drag Rendervous to Applications, then right-click the app and
          choose Open on first launch. Enter your OpenRouter API key."
          --generate-notes --verify-tag
