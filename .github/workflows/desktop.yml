name: Build desktop apps

# Manual runs create unsigned QA builds. Version tags require signing secrets
# and publish signed installers to GitHub Releases.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Rendervous-windows-x64
          - os: macos-15
            artifact: Rendervous-macos-arm64
          - os: macos-15-intel
            artifact: Rendervous-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must be vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          else
            APP_VERSION="0.1.0"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build frontend
        run: npm ci && npm run build

      - name: Install backend + packaging deps
        run: pip install -r requirements-desktop.txt

      - name: Build app
        run: >-
          pyinstaller packaging/rendervous.spec --noconfirm
          --distpath build/app --workpath build/pyinstaller

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Package and sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: >-
            ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: >-
            ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          $release = $env:GITHUB_REF -like 'refs/tags/*'
          $pfx = Join-Path $env:RUNNER_TEMP 'rendervous-signing.pfx'

          if ($release) {
            if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64 -or
                -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
              throw 'Missing Windows signing secrets.'
            }
            $bytes = [Convert]::FromBase64String(
              $env:WINDOWS_CERTIFICATE_PFX_BASE64)
            [IO.File]::WriteAllBytes($pfx, $bytes)

            $sdk = Join-Path "${env:ProgramFiles(x86)}" `
              'Windows Kits\10\bin'
            $signtool = Get-ChildItem $sdk -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) {
              throw 'Windows SDK signtool.exe was not found.'
            }

            $signArgs = @(
              'sign', '/f', $pfx, '/p', $env:WINDOWS_CERTIFICATE_PASSWORD,
              '/fd', 'SHA256', '/tr', 'http://timestamp.digicert.com',
              '/td', 'SHA256'
            )
            Get-ChildItem build/app/Rendervous -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.dll', '.pyd' } |
              ForEach-Object {
                & $signtool @signArgs $_.FullName
                if ($LASTEXITCODE -ne 0) {
                  throw "Signing failed: $($_.Name)"
                }
              }
          }

          $iscc = Join-Path "${env:ProgramFiles(x86)}" `
            'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler was not found.'
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" `
            packaging/windows/Rendervous.iss
          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup compilation failed.'
          }

          if ($release) {
            $installer = "build/release/Rendervous-Windows-Setup-" + `
              "$env:APP_VERSION.exe"
            & $signtool @signArgs $installer
            if ($LASTEXITCODE -ne 0) {
              throw 'Signing the installer failed.'
            }
            Remove-Item $pfx -Force
          }

      - name: Sign macOS app
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE_P12_BASE64: >-
            ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: >-
            ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE_P12_BASE64" ||
                -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo 'Missing Apple signing certificate secrets.' >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/rendervous-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/rendervous-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" |
            base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" |
            awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo 'No Developer ID Application identity found.' >&2
            exit 1
          fi
          codesign --deep --force --options runtime --timestamp \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" \
            build/app/Rendervous.app
          codesign --verify --deep --strict --verbose=2 \
            build/app/Rendervous.app
          rm -f "$P12"

      - name: Create and notarize macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: >-
            ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build/release build/dmg
          cp -R build/app/Rendervous.app build/dmg/
          ln -s /Applications build/dmg/Applications
          DMG="build/release/${{ matrix.artifact }}-$APP_VERSION.dmg"
          hdiutil create -volname Rendervous -srcfolder build/dmg \
            -ov -format UDZO "$DMG"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" ||
                  -z "$APPLE_TEAM_ID" ]]; then
              echo 'Missing Apple notarization secrets.' >&2
              exit 1
            fi
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: Rendervous-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-assets/*
          --title "${GITHUB_REF_NAME}"
          --notes "Windows: run the installer. macOS: open the DMG and drag
          Rendervous to Applications. Launch the app and enter your OpenRouter
          API key."
          --generate-notes --verify-tag
